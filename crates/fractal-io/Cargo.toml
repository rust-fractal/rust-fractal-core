[package]
name = "fractal-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Native settings serialization and image export for fractal-core."
license = "MIT"

[features]
default = ["png-export", "jpeg-export", "exr-export"]
png-export = ["dep:image"]
jpeg-export = ["dep:image"]
exr-export = ["dep:exr"]

[dependencies]
fractal-core = { path = "../fractal-core", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
exr = { version = "1.74.2", optional = true }
