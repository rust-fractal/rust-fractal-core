[package]
name = "rust_fractal"
version = "0.14.0"
authors = ["jackyarndley <34801340+jackyarndley@users.noreply.github.com>"]
description = "Fast, efficient mandelbrot set renderer."
edition = "2024"
rust-version = "1.97"
autobins = false

[workspace]
members = [
    "crates/fractal-core",
    "crates/fractal-arbitrary",
    "crates/fractal-io",
    "crates/fractal-numerics",
    "crates/fractal-runtime",
]
resolver = "3"

[features]
default = []
malachite = ["fractal-numerics/malachite"]

[dependencies]
fractal-core = { path = "crates/fractal-core" }
fractal-numerics = { path = "crates/fractal-numerics" }

[dev-dependencies]
criterion = "0.8.2"
fractal-arbitrary = { path = "crates/fractal-arbitrary" }
fractal-io = { path = "crates/fractal-io" }
fractal-runtime = { path = "crates/fractal-runtime" }
toml = "1.1.4"

[[bench]]
name = "core_render"
harness = false

[[bench]]
name = "numerics"
harness = false

[[bench]]
name = "arbitrary_reference"
harness = false
required-features = ["malachite"]

[[bench]]
name = "runtime_scaling"
harness = false

[[bench]]
name = "reference_allocations"
harness = false

#Additional commands that can improve performance (maybe by around 5-10%)
[profile.release]
debug = true
#incremental = true
